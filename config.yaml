# Corridor — methodology configuration
# -------------------------------------
# This file holds the WATCHLIST and the METHODOLOGY PARAMETERS. Secrets and
# machine-specific paths live in `.env` (see .env.example), never here.
#
# Philosophy: start narrow, go deep. Ten names done rigorously beats a hundred
# done shallowly. Seed universe is the focused large-cap tech/AI set below.

# ---------------------------------------------------------------------------
# Universe / watchlist
# ---------------------------------------------------------------------------
# `cik` is the SEC Central Index Key used for EDGAR companyfacts lookups.
# It is filled in during Stage 1 ingestion; left null here so nothing is
# hardcoded incorrectly. Tickers are the single source of truth for the run.
universe:
  - ticker: NVDA
    name: NVIDIA Corp
    cik: null
  - ticker: MSFT
    name: Microsoft Corp
    cik: null
  - ticker: AAPL
    name: Apple Inc
    cik: null
  - ticker: GOOGL
    name: Alphabet Inc
    cik: null
  - ticker: AMZN
    name: Amazon.com Inc
    cik: null
  - ticker: META
    name: Meta Platforms Inc
    cik: null
  - ticker: TSLA
    name: Tesla Inc
    cik: null
  - ticker: AMD
    name: Advanced Micro Devices Inc
    cik: null
  - ticker: AVGO
    name: Broadcom Inc
    cik: null
  - ticker: MU
    name: Micron Technology Inc
    cik: null

# ---------------------------------------------------------------------------
# Factor 1 — Earnings (the anchor)
# ---------------------------------------------------------------------------
earnings:
  # Which earnings model drives the engine. v1 = consensus passthrough.
  # The EarningsModel interface (src/corridor/engine/earnings.py) lets you later
  # plug in your own per-segment estimates without touching the valuation math.
  model: consensus
  # How many forward (unreported) quarters define the "next-4-quarter" EPS sum.
  forward_window_quarters: 4

# ---------------------------------------------------------------------------
# Factor 2 — Valuation: forward-P/E corridor / True P/E
# ---------------------------------------------------------------------------
valuation:
  corridor:
    # Percentile bands for the historical forward-P/E distribution.
    pctl_low: 20
    pctl_high: 80
    # Lookback window (calendar days) over which the distribution is computed.
    # NOTE: real history will be far shorter than this at launch and grows as
    # the daily job accumulates snapshots. See min_history_days.
    lookback_days: 504
    # Below this many days of REAL snapshot history, charts/signals are flagged
    # as thin and must be interpreted with caution (surfaced in UI + memos).
    min_history_days: 60
  signals:
    # "hard buy" when price sits in the bottom decile of its historical forward
    # multiple AND the earnings trend is rising.
    hard_buy_pctl: 10
    buy_pctl: 20
    trim_pctl: 80
    hard_trim_pctl: 90
  premium_term:
    # Optional company-premium term: regress the multiple on growth/quality so a
    # persistently-premium name isn't flagged as permanently overvalued.
    # Kept SEPARATE from PEG on purpose — the disagreement between the two is
    # itself signal. v1 leaves this disabled; enable in a later stage.
    enabled: false

# ---------------------------------------------------------------------------
# Factor 2b — Growth-adjusted valuation (forward PEG)
# ---------------------------------------------------------------------------
peg:
  # The growth basis is the whole ballgame for PEG. It is made EXPLICIT here and
  # LOGGED on every calculation. Options:
  #   ntm_vs_ltm : next-twelve-month EPS vs last-twelve-month EPS (default)
  #   fwd_cagr   : multi-year forward EPS CAGR (uses cagr_years out-year estimates)
  growth_basis: ntm_vs_ltm
  cagr_years: 3
  # Context-only heuristics (NOT hard triggers). The actual signal always defers
  # to the corridor + earnings trend.
  cheap_threshold: 1.0
  rich_threshold: 2.0
  # Guardrail: when the forward growth rate falls below this (near-zero or
  # negative), PEG division blows up / sign-flips. Suppress the PEG signal and
  # fall back to the corridor.
  min_growth_rate: 0.02

# ---------------------------------------------------------------------------
# Factor 3 — Sentiment / base-rate overlay
# ---------------------------------------------------------------------------
overlay:
  rsi_period: 14
  ma_periods: [50, 200]
  streak:
    # Winning-streak base-rate study: distribution of consecutive weekly-gain
    # streak lengths and forward returns conditioned on streak length.
    frequency: weekly
    lookback_years: 10
  earnings_calendar:
    # Days around a report to raise pre/post-earnings positioning flags.
    pre_window_days: 7
    post_window_days: 2
  # Future hook only — do not build yet.
  finbert_sentiment:
    enabled: false

# ---------------------------------------------------------------------------
# Data sources (swappable interface — see src/corridor/datasources/base.py)
# ---------------------------------------------------------------------------
# The engine does not care WHERE snapshots come from. Swapping a paid historical
# estimates provider in later means changing these names + adding an adapter,
# never rewriting the corridor/PEG math.
data:
  price_source: yfinance
  forward_estimate_source: fmp   # PRIMARY: FMP gives true per-quarter forward EPS
  price_crosscheck_source: fmp   # cross-check yfinance price against FMP for the same date
  fundamentals_source: edgar     # trailing/as-reported actuals; backfill is honest here
  # Engine version stamped onto derived valuation rows for reproducibility.
  engine_version: "0.1.0"
  # FMP endpoint config. The API key lives in .env (FMP_API_KEY), never here.
  # NOTE: all three adapters are UNVALIDATED against live endpoints until
  # scripts/validate_live.py has been run with a real key + network.
  fmp:
    base_url: "https://financialmodelingprep.com"
    # CURRENT stable API: /stable/analyst-estimates?symbol=&period=&page=&limit=
    # (the deprecated /api/v3 path 403s). The api key lives in .env (FMP_API_KEY).
    forward_window_buffer_days: 120   # retain a just-ended, unreported quarter
    # v1 = Starter plan: ANNUAL estimates only (period=quarter is Premium-gated),
    # and limit is capped at 10 (higher 402s). The multi-year annual curve is what
    # the forward quarters are derived from. Set fetch_quarterly: true on Premium.
    estimates_page_limit: 10          # Starter cap; adapter pages through if needed
    fetch_quarterly: false            # Premium only — true per-quarter estimates

  # FY-label alignment gate scope: the forward sum only consumes the current fiscal
  # year's actuals, so the gate CERTIFIES a trailing window of this many fiscal years
  # (in-window quarters must align). Older quarters are exempt + logged, not gated
  # (NVIDIA's pre-2023 52/53-week period boundaries shifted; old labels can't be
  # date-derived with one fixed calendar, and the forward sum never uses them).
  alignment_gate_trailing_years: 3

  # Reconciliation / sanity thresholds (each one is exercised by a test).
  thresholds:
    ntm_divergence_pct: 0.10      # strict 4Q sum vs provider-native NTM -> flag
    price_disagreement_pct: 0.01  # yfinance vs FMP price -> flag (store both)
    true_pe_jump_factor: 2.0      # >Nx day-over-day move w/o split -> quarantine
    quarterly_xcheck_pct: 0.15    # annual-derived next-Q EPS vs yfinance next-Q -> flag

  # Per-company fiscal-year-end (month, day). MANY of these are off-calendar; the
  # corridor window MUST use the company's own fiscal quarters. These seeds are
  # cross-checked against EDGAR period-end dates by scripts/validate_live.py.
  fiscal_calendars:
    NVDA: {fy_end_month: 1,  fy_end_day: 31, note: "FY ends late January (e.g. 2026-01-25)"}
    MSFT: {fy_end_month: 6,  fy_end_day: 30, note: "FY ends June 30"}
    AAPL: {fy_end_month: 9,  fy_end_day: 28, note: "FY ends last Saturday of September"}
    AVGO: {fy_end_month: 11, fy_end_day: 3,  note: "52/53-week FY ends early November"}
    MU:   {fy_end_month: 8,  fy_end_day: 29, note: "FY ends Thursday nearest Aug 31"}
    GOOGL: {fy_end_month: 12, fy_end_day: 31, note: "calendar year"}
    AMZN: {fy_end_month: 12, fy_end_day: 31, note: "calendar year"}
    META: {fy_end_month: 12, fy_end_day: 31, note: "calendar year"}
    TSLA: {fy_end_month: 12, fy_end_day: 31, note: "calendar year"}
    AMD:  {fy_end_month: 12, fy_end_day: 31, note: "calendar year (last Saturday of Dec)"}

# ---------------------------------------------------------------------------
# Unsupported names (foreign / ADR) — EXCLUDED from v1 on purpose
# ---------------------------------------------------------------------------
# These are NOT bugs to work around. v1 enforces a HARD currency-match guard: if a
# ticker's report currency != its price currency, Corridor refuses to compute True
# P/E / PEG, quarantines the snapshot to ingestion_log ("currency mismatch —
# unsupported in v1"), and surfaces an explicit "unsupported" state. Supporting an
# ADR is a PREREQUISITE task (FX conversion + ADR share ratio), to be built and
# tested against a real ADR when one is actually added — see the TODO in
# src/corridor/ingest/job.py. Example left here as documentation:
unsupported:
  - ticker: TSM
    reason: "ADR — TWD reporter vs USD price; needs FX + 5:1 ADR share ratio (not in v1)"
